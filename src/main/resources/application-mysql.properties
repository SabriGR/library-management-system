# Use with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Set the credentials as environment variables, never in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/librarymanagmentsystem?createDatabaseIfNotExist=true}
