spring.application.name=library-management-system

# Default database: H2 in memory, so the project runs without any setup.
# For MySQL start the application with the profile "mysql" (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# The controllers convert entities to DTOs while the session is still open.
spring.jpa.open-in-view=true

logging.level.AUDIT=INFO
