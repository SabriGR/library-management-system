<text x="575" y="36" text-anchor="middle" font-size="22" font-weight="bold"  fill="#222">Control flow graph of LibraryService.borrowBook (N = 13, E = 17, V(G) = 6)</text><rect x="880" y="150" width="150" height="680" fill="#fff" stroke="#222" stroke-width="2"/><text x="955" y="460" text-anchor="middle" font-size="17" font-weight="bold"  fill="#222">throw</text><text x="955" y="484" text-anchor="middle" font-size="17" font-weight="bold"  fill="#222">exception</text><text x="955" y="508" text-anchor="middle" font-size="17"   fill="#222">(exit with</text><text x="955" y="532" text-anchor="middle" font-size="17"   fill="#222">error code)</text><rect x="160" y="62" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="95" text-anchor="middle" font-size="16"   fill="#222">N1: member = findById(userId)</text><polygon points="360,155 560,190 360,225 160,190" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="195" text-anchor="middle" font-size="16"   fill="#222">D1: member == null ?</text><polygon points="360,255 560,290 360,325 160,290" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="295" text-anchor="middle" font-size="16"   fill="#222">D2: member not active ?</text><rect x="160" y="362" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="385" text-anchor="middle" font-size="16"   fill="#222">N2: rules = getRules()</text><text x="360" y="405" text-anchor="middle" font-size="16"   fill="#222">loans = count active loans</text><polygon points="360,455 560,490 360,525 160,490" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="495" text-anchor="middle" font-size="16"   fill="#222">D3: loans &gt;= maxLoans ?</text><rect x="160" y="562" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="595" text-anchor="middle" font-size="16"   fill="#222">N3: book = findByIdAndRemovedFalse(bookId)</text><polygon points="360,655 560,690 360,725 160,690" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="695" text-anchor="middle" font-size="16"   fill="#222">D4: book == null ?</text><polygon points="360,755 560,790 360,825 160,790" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="795" text-anchor="middle" font-size="16"   fill="#222">D5: no copy available ?</text><rect x="160" y="862" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="885" text-anchor="middle" font-size="16"   fill="#222">N4: book.decreaseCopies()</text><text x="360" y="905" text-anchor="middle" font-size="16"   fill="#222">save(book)</text><rect x="160" y="962" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="985" text-anchor="middle" font-size="16"   fill="#222">N5: save(record)</text><text x="360" y="1005" text-anchor="middle" font-size="16"   fill="#222">fulfillIfReady(), audit</text><rect x="160" y="1062" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="1095" text-anchor="middle" font-size="16"   fill="#222">Return record</text><circle cx="360" cy="1200" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="1206" text-anchor="middle" font-size="15"   fill="#222">Exit</text><polyline points="360,118 360,155" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="560,190 879,190" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="588" y="182" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="360,225 360,255" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="386" y="247" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="560,290 879,290" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="588" y="282" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="360,325 360,362" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="386" y="347" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="360,418 360,455" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="560,490 879,490" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="588" y="482" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="360,525 360,562" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="386" y="547" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="360,618 360,655" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="560,690 879,690" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="588" y="682" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="360,725 360,755" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="386" y="747" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="560,790 879,790" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="588" y="782" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="360,825 360,862" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="386" y="847" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="360,918 360,962" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="360,1018 360,1062" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="360,1118 360,1175" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="955,830 955,1200 385,1200" fill="none" stroke="#222" stroke-width="1.6" marker-end=