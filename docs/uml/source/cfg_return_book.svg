<text x="575" y="36" text-anchor="middle" font-size="22" font-weight="bold"  fill="#222">Control flow graph of LibraryService.returnBook (N = 10, E = 12, V(G) = 4)</text><rect x="880" y="150" width="150" height="180" fill="#fff" stroke="#222" stroke-width="2"/><text x="955" y="215" text-anchor="middle" font-size="17" font-weight="bold"  fill="#222">throw</text><text x="955" y="239" text-anchor="middle" font-size="17" font-weight="bold"  fill="#222">exception</text><text x="955" y="263" text-anchor="middle" font-size="17"   fill="#222">(exit with</text><text x="955" y="287" text-anchor="middle" font-size="17"   fill="#222">error code)</text><rect x="130" y="62" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="95" text-anchor="middle" font-size="16"   fill="#222">N1: record = findById(recordId)</text><polygon points="330,155 530,190 330,225 130,190" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="195" text-anchor="middle" font-size="16"   fill="#222">D1: record == null ?</text><polygon points="330,255 530,290 330,325 130,290" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="295" text-anchor="middle" font-size="16"   fill="#222">D2: already returned ?</text><rect x="130" y="358" width="400" height="84" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="385" text-anchor="middle" font-size="16"   fill="#222">N2: markReturned(today)</text><text x="330" y="405" text-anchor="middle" font-size="16"   fill="#222">book.increaseCopies(), save(book)</text><text x="330" y="425" text-anchor="middle" font-size="16"   fill="#222">daysLate = record.daysLate(today)</text><polygon points="330,485 530,520 330,555 130,520" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="525" text-anchor="middle" font-size="16"   fill="#222">D3: daysLate &gt; 0 ?</text><rect x="460" y="622" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="660" y="645" text-anchor="middle" font-size="16"   fill="#222">N3: createFine(record,</text><text x="660" y="665" text-anchor="middle" font-size="16"   fill="#222">daysLate, rate)</text><rect x="130" y="742" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="765" text-anchor="middle" font-size="16"   fill="#222">N4: notifyNextWaiting(book)</text><text x="330" y="785" text-anchor="middle" font-size="16"   fill="#222">save(record), audit</text><rect x="130" y="852" width="400" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="885" text-anchor="middle" font-size="16"   fill="#222">Return record</text><circle cx="330" cy="980" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="330" y="986" text-anchor="middle" font-size="15"   fill="#222">Exit</text><polyline points="330,118 330,155" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="530,190 879,190" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="556" y="182" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="330,225 330,255" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="354" y="244" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="530,290 879,290" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="556" y="282" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="330,325 330,358" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="354" y="344" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="330,442 330,485" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="530,520 660,520 660,622" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="544" y="512" text-anchor="middle" font-size="15"  font-style="italic" fill="#222">true</text><polyline points="660,678 660,770 531,770" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="330,555 330,742" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="354" y="574" text-anchor="start" font-size="15"  font-style="italic" fill="#222">false</text><polyline points="330,798 330,852" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="330,908 330,955" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="955,330 955,980 355,980" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
