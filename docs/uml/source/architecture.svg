<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970" font-family="Arial, sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#222"/></marker></defs>
<rect width="1500" height="970" fill="#fff"/>
<rect x="60" y="30" width="960" height="76" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="60" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Client</text><text x="540" y="88" text-anchor="middle" font-size="17"   fill="#222">Postman, Swagger UI or any HTTP client</text><rect x="60" y="156" width="960" height="76" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="186" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Security filter</text><text x="540" y="214" text-anchor="middle" font-size="17"   fill="#222">HTTP Basic login  |  BCrypt password check  |  role rules: Member, Librarian, Administrator</text><rect x="60" y="282" width="960" height="102" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="312" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Controller layer</text><text x="540" y="340" text-anchor="middle" font-size="17"   fill="#222">Auth, Book, Member, Library, Reservation, Fine, Report and Admin controllers</text><text x="540" y="366" text-anchor="middle" font-size="17"   fill="#222">Request validation, conversion to DTOs</text><rect x="60" y="434" width="960" height="128" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="464" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Service layer</text><text x="540" y="492" text-anchor="middle" font-size="17"   fill="#222">LibraryService, BookService, MemberService, ReservationService, FineService,</text><text x="540" y="518" text-anchor="middle" font-size="17"   fill="#222">NotificationService, RulesService, StaffService, ReportService, AuditService</text><text x="540" y="544" text-anchor="middle" font-size="17"   fill="#222">Business rules and transactions</text><rect x="60" y="612" width="960" height="76" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="642" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Repository layer</text><text x="540" y="670" text-anchor="middle" font-size="17"   fill="#222">Spring Data JPA repositories</text><rect x="60" y="738" width="960" height="76" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="768" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Entity layer</text><text x="540" y="796" text-anchor="middle" font-size="17"   fill="#222">User, Member, Librarian, Administrator, Book, BorrowingRecord, Fine, Reservation, LibraryRules</text><rect x="60" y="864" width="960" height="76" fill="#fff" stroke="#222" stroke-width="2"/><text x="540" y="894" text-anchor="middle" font-size="21" font-weight="bold"  fill="#222">Database</text><text x="540" y="922" text-anchor="middle" font-size="17"   fill="#222">H2 in memory (default) or MySQL</text><polyline points="540,106 540,154" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="540,232 540,280" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="540,384 540,432" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="540,562 540,610" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="540,688 540,736" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><polyline points="540,814 540,862" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="554" y="137" text-anchor="start" font-size="15"  font-style="italic" fill="#222">HTTP request (JSON)</text><text x="554" y="845" text-anchor="start" font-size="15"  font-style="italic" fill="#222">Hibernate / JPA</text><rect x="1090" y="282" width="360" height="110" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="8,5"/><text x="1270" y="314" text-anchor="middle" font-size="19" font-weight="bold"  fill="#222">Global exception handler</text><text x="1270" y="344" text-anchor="middle" font-size="16"   fill="#222">Every error becomes a JSON body</text><text x="1270" y="368" text-anchor="middle" font-size="16"   fill="#222">with a code and a message</text><line x1="1020" y1="337" x2="1090" y2="337" stroke="#222" stroke-width="1.6" stroke-dasharray="6,5"/><rect x="1090" y="434" width="360" height="110" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="8,5"/><text x="1270" y="466" text-anchor="middle" font-size="19" font-weight="bold"  fill="#222">Audit log</text><text x="1270" y="496" text-anchor="middle" font-size="16"   fill="#222">Borrow, return and account</text><text x="1270" y="520" text-anchor="middle" font-size="16"   fill="#222">changes are stored in logs/audit.log</text><line x1="1020" y1="489" x2="1090" y2="489" stroke="#222" stroke-width="1.6" stroke-dasharray="6,5"/>
</svg>